<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linguistics Quest responsive preview</title><style>body{font:16px system-ui;margin:20px;background:#eee}label,button{margin-right:12px}iframe{display:block;margin-top:20px;border:1px solid #999;height:844px;width:390px;background:white}</style><h1>Responsive preview</h1><p>A constrained frame checks the live app’s CSS layout. This does not emulate phone hardware.</p><label>Width <select id="width"><option>320</option><option selected>390</option><option>430</option></select></label><label>App <select id="app"><option value="academy">Academy</option><option value="visual-library">Visual library</option></select></label><iframe title="App preview" src="../academy/"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#width').onchange=e=>frame.style.width=e.target.value+'px';document.querySelector('#app').onchange=e=>frame.src='../'+e.target.value+'/';</script></html>

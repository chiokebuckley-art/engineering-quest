<linearGradient id="workshop-lab-brass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6d1d"/><stop offset="0.5" stop-color="#c9a227"/><stop offset="1" stop-color="#8a6d1d"/></linearGradient>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img">
<title>Workshop Laboratory: a stone workshop interior with a wooden workbench, tool rack, small furnace, shelves and a dusty covered machine in the corner, lit by warm lamp light</title>

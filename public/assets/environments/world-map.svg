<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img">
<title>World map: a parchment-and-hologram overview of terrain from a green valley through mountains, forest, river, factories, a city, a geometric kingdom, snowy peaks and a high-tech frontier, fading into unknown fog in the upper right</title>
<defs>
<linearGradient id="world-map-paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbbd98"/><stop offset="0.5" stop-color="#b9a97f"/><stop offset="1" stop-color="#8f8467"/></linearGradient>
<radialGradient id="world-map-stain" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6b5a3a" stop-opacity="0.18"/><stop offset="1" stop-color="#6b5a3a" stop-opacity="0"/></radialGradient>
<radialGradient id="world-map-light" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff7dc" stop-opacity="0.35"/><stop offset="1" stop-color="#fff7dc" stop-opacity="0"/></radialGradient>
<linearGradient id="world-map-fog" x1="0" y1="1" x2="1" y2="0"><stop offset="0.5" stop-color="#0b1020" stop-opacity="0"/><stop offset="0.66" stop-color="#0b1020" stop-opacity="0.5"/><stop offset="0.82" stop-color="#0b1020" stop-opacity="0.86"/><stop offset="1" stop-color="#0b1020" stop-opacity="0.96"/></linearGradient>
<linearGradient id="world-map-valley" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ea86a"/><stop offset="1" stop-color="#5a8a4a"/></linearGradient>
<linearGradient id="world-map-mtn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a8f9a"/><stop offset="1" stop-color="#4c566a"/></linearGradient>
<linearGradient id="world-map-snow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6fa"/><stop offset="0.4" stop-color="#c9d3e3"/><stop offset="1" stop-color="#6b7a94"/></linearGradient>
<linearGradient id="world-map-river" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fb7c8"/><stop offset="1" stop-color="#3a7f93"/></linearGradient>
<linearGradient id="world-map-ind" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a6a5a"/><stop offset="1" stop-color="#4a3f36"/></linearGradient>
<linearGradient id="world-map-city" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a9fae"/><stop offset="1" stop-color="#5a6070"/></linearGradient>
<linearGradient id="world-map-geo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c5fd6"/></linearGradient>
<linearGradient id="world-map-tech" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe8f2"/><stop offset="1" stop-color="#1e8a9c"/></linearGradient>
<radialGradient id="world-map-gridglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="world-map-reactor" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.6"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>

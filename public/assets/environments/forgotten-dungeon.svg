<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img">
<title>Dungeon of Forgotten Knowledge: a library crypt of collapsed shelves, floating torn pages and cobwebs in dim violet-grey light, with faint amber runes flickering back to life</title>
<defs>
<linearGradient id="forgotten-dungeon-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0b18"/><stop offset="0.6" stop-color="#1f1a2e"/><stop offset="1" stop-color="#15121f"/></linearGradient>
<radialGradient id="forgotten-dungeon-violet" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.28"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<radialGradient id="forgotten-dungeon-amber" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffb347" stop-opacity="0.45"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
<linearGradient id="forgotten-dungeon-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1828"/><stop offset="1" stop-color="#332b45"/></linearGradient>
<linearGradient id="forgotten-dungeon-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2538"/><stop offset="1" stop-color="#120f1a"/></linearGradient>
<linearGradient id="forgotten-dungeon-wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a1d18"/><stop offset="0.5" stop-color="#4a3428"/><stop offset="1" stop-color="#241812"/></linearGradient>
<linearGradient id="forgotten-dungeon-page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e5e7eb"/><stop offset="1" stop-color="#9a94a8"/></linearGradient>
<linearGradient id="forgotten-dungeon-col" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1c1828"/><stop offset="0.4" stop-color="#4c4460"/><stop offset="1" stop-color="#1c1828"/></linearGradient>
</defs>
<rect width="1280" height="720" fill="url(#forgotten-dungeon-bg)"/>

      <stop offset="0" stop-color="#4ade80" stop-opacity="0.36"/>
      <stop offset="0.6" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0b1020"/>
    </radialGradient>
    <linearGradient id="dr-catalyst-skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ead0aa"/>
      <stop offset="1" stop-color="#b3855a"/>
    </linearGradient>
    <linearGradient id="dr-catalyst-coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#aeb6c4"/>

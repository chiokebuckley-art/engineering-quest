<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img">
  <title>Dr. Catalyst, chemical engineering teacher: a woman in her mid-thirties with dark curly hair tied back, safety glasses pushed up, a lab coat over a green shirt and a glowing green vial in her pocket</title>
  <defs>

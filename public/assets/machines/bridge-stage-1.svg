<g fill="#a3a8b4"><circle cx="200" cy="168" r="3.5"/><circle cx="256" cy="168" r="3.5"/><circle cx="312" cy="168" r="3.5"/><circle cx="200" cy="236" r="3.5"/><circle cx="312" cy="236" r="3.5"/><circle cx="256" cy="250" r="3.5"/><circle cx="140" cy="168" r="3.5"/><circle cx="372" cy="168" r="3.5"/></g>
<g stroke="#151827" stroke-width="2" fill="url(#bridge-stage-1-iron)"><rect x="128" y="158" width="14" height="24" rx="2"/><rect x="370" y="158" width="14" height="24" rx="2"/></g>
<g fill="#3b4252" stroke="#151827" stroke-width="2"><polygon points="200,330 228,318 250,340 236,362 206,356"/><polygon points="312,330 284,318 262,340 276,362 306,356"/></g>

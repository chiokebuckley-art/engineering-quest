<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img">
  <title>Professor Vector, mathematics teacher: an older silver-haired scholar with brass-rimmed spectacles and a dark blue robe-coat pinned with a copper vector arrow</title>
  <defs>
    <radialGradient id="professor-vector-bg" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0b1020"/>
    </radialGradient>
    <linearGradient id="professor-vector-skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4dcc0"/>
      <stop offset="1" stop-color="#c79a70"/>
    </linearGradient>
    <linearGradient id="professor-vector-coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f4585"/>
      <stop offset="1" stop-color="#101a3c"/>
    </linearGradient>
    <linearGradient id="professor-vector-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#8f99ad"/>
    </linearGradient>
    <linearGradient id="professor-vector-brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eacb5a"/>
      <stop offset="1" stop-color="#8a6d1d"/>
    </linearGradient>
    <linearGradient id="professor-vector-shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#9ca3af"/>
    </linearGradient>
  </defs>
  <!-- backdrop disc -->
  <circle cx="128" cy="118" r="100" fill="url(#professor-vector-bg)" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="128" cy="118" r="92" fill="none" stroke="#2dd4bf" stroke-opacity="0.18"/>
  <!-- robe-coat -->
  <path d="M28 256 L28 236 Q32 202 72 188 L112 174 L144 174 L184 188 Q224 202 228 236 L228 256 Z" fill="url(#professor-vector-coat)" stroke="#0b1020" stroke-width="2"/>
  <path d="M112 174 L144 174 L128 214 Z" fill="url(#professor-vector-shirt)" stroke="#0b1020" stroke-width="1.5"/>
  <path d="M112 174 L96 196 L114 236 L128 214 Z" fill="#1a2a5c" stroke="#0b1020" stroke-width="1.5"/>
  <path d="M144 174 L160 196 L142 236 L128 214 Z" fill="#243a78" stroke="#0b1020" stroke-width="1.5"/>
  <path d="M60 196 Q54 226 56 256" fill="none" stroke="#0b1020" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M196 196 Q202 226 200 256" fill="none" stroke="#0b1020" stroke-opacity="0.5" stroke-width="1.5"/>
  <!-- rune trim on the collar -->
  <path d="M100 186 L106 196 M92 202 L98 210" fill="none" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="1.5"/>
  <!-- copper vector pin -->
  <path d="M164 232 L184 212" fill="none" stroke="#b87333" stroke-width="3" stroke-linecap="round"/>
  <polygon points="188,208 174,212 184,222" fill="#d98b4a" stroke="#5a3417" stroke-width="1"/>
  <circle cx="164" cy="232" r="3" fill="#b87333" stroke="#5a3417"/>
  <!-- neck -->
  <path d="M114 146 L114 180 L142 180 L142 146 Z" fill="url(#professor-vector-skin)" stroke="#6b4a30" stroke-width="1.5"/>
  <path d="M114 148 Q128 166 142 148 L142 160 Q128 172 114 160 Z" fill="#000" fill-opacity="0.22"/>
  <!-- head, lean and angular -->
  <path d="M92 104 Q94 60 128 58 Q162 60 164 104 Q164 138 146 154 Q136 164 128 164 Q120 164 110 154 Q92 138 92 104 Z" fill="url(#professor-vector-skin)" stroke="#6b4a30" stroke-width="2"/>
  <path d="M148 66 Q166 96 162 136 Q154 154 130 164 Q142 150 148 128 Q154 98 148 66 Z" fill="#000" fill-opacity="0.13"/>
  <ellipse cx="91" cy="114" rx="6" ry="9" fill="url(#professor-vector-skin)" stroke="#6b4a30" stroke-width="1.5"/>
  <ellipse cx="165" cy="114" rx="6" ry="9" fill="#d9ad84" stroke="#6b4a30" stroke-width="1.5"/>
  <!-- silver hair swept back, receding -->
  <path d="M88 104 Q84 52 128 48 Q172 52 168 104 Q166 78 152 66 Q140 76 128 82 Q116 76 104 66 Q90 78 88 104 Z" fill="url(#professor-vector-hair)" stroke="#5c6579" stroke-width="2"/>
  <path d="M88 104 Q82 126 90 140 L97 130 Q90 118 88 104 Z" fill="url(#professor-vector-hair)" stroke="#5c6579" stroke-width="1.5"/>
  <path d="M168 104 Q174 126 166 140 L159 130 Q166 118 168 104 Z" fill="url(#professor-vector-hair)" stroke="#5c6579" stroke-width="1.5"/>
  <path d="M104 66 Q112 56 128 54 M152 66 Q144 56 130 54 M96 82 Q100 66 110 60 M160 82 Q156 66 146 60 M128 82 Q126 66 128 54" fill="none" stroke="#5c6579" stroke-opacity="0.55" stroke-width="1.3"/>
  <path d="M100 62 Q112 52 126 52" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
  <!-- brows, sharp -->
  <path d="M102 99 L122 96" fill="none" stroke="#b8bfcc" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M136 96 L156 99" fill="none" stroke="#b8bfcc" stroke-width="2.8" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="113" cy="111" rx="7" ry="4.6" fill="#f3f4f6"/>
  <circle cx="114" cy="111.5" r="3.6" fill="#3f7f8f"/>
  <circle cx="114" cy="111.5" r="1.8" fill="#0b1020"/>
  <circle cx="112.6" cy="110" r="1.1" fill="#fff"/>
  <path d="M106 110 Q113 105.5 120 110" fill="none" stroke="#5a3a26" stroke-width="1.6"/>
  <ellipse cx="145" cy="111" rx="7" ry="4.6" fill="#f3f4f6"/>
  <circle cx="146" cy="111.5" r="3.6" fill="#3f7f8f"/>
  <circle cx="146" cy="111.5" r="1.8" fill="#0b1020"/>
  <circle cx="144.6" cy="110" r="1.1" fill="#fff"/>
  <path d="M138 110 Q145 105.5 152 110" fill="none" stroke="#5a3a26" stroke-width="1.6"/>
  <!-- spectacles -->
  <circle cx="113" cy="112" r="10.5" fill="#2dd4bf" fill-opacity="0.12" stroke="url(#professor-vector-brass)" stroke-width="2"/>
  <circle cx="145" cy="112" r="10.5" fill="#2dd4bf" fill-opacity="0.12" stroke="url(#professor-vector-brass)" stroke-width="2"/>
  <path d="M123.5 111 Q129 106 134.5 111" fill="none" stroke="#c9a227" stroke-width="2"/>
  <path d="M102.5 111 L92 108 M155.5 111 L164 108" fill="none" stroke="#c9a227" stroke-width="2"/>
  <path d="M107 106 Q110 103 114 103" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.2"/>
  <!-- nose and mouth -->
  <path d="M129 110 Q127 121 124 128 Q129 131 134 128" fill="none" stroke="#8a5a3a" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M100 126 Q104 136 111 141 M158 126 Q154 136 147 141" fill="none" stroke="#8a5a3a" stroke-opacity="0.35" stroke-width="1.4"/>
  <path d="M118 141 Q129 147 140 140" fill="none" stroke="#7a4636" stroke-width="2" stroke-linecap="round"/>
  <path d="M120 145 Q129 149 138 144" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1"/>
</svg>

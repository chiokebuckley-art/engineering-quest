      <stop offset="1" stop-color="#0b1020"/>
    </radialGradient>
    <linearGradient id="avatar-06-skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c25a"/>
      <stop offset="1" stop-color="#8a6210"/>

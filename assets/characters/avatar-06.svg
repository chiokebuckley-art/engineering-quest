<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img">
  <title>Apprentice engineer avatar: a sentient apprentice automaton with a riveted brass faceplate, two glowing amber eye-lenses and a dark cloth hood, wearing a leather-and-brass apprentice jerkin with a glowing rune chisel on the shoulder</title>

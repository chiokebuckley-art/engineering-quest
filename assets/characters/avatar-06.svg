    <radialGradient id="avatar-06-lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff2c8"/>
      <stop offset="0.4" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#8a4a10"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img">
  <title>Professor Newton, physics teacher: a warm brown-skinned scholar with a grey beard, tweed vest, pocket watch and a brass apple pendulum pinned to his chest</title>
  <defs>
    <radialGradient id="professor-newton-bg" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0b1020"/>
    </radialGradient>
    <linearGradient id="professor-newton-skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8784a"/>
      <stop offset="1" stop-color="#6e3f1f"/>
    </linearGradient>
    <linearGradient id="professor-newton-vest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6a48"/>
      <stop offset="1" stop-color="#4a3521"/>
    </linearGradient>
    <linearGradient id="professor-newton-shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5efe0"/>
      <stop offset="1" stop-color="#c9bda3"/>
    </linearGradient>
    <linearGradient id="professor-newton-beard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7dbe3"/>
      <stop offset="1" stop-color="#7d8595"/>
    </linearGradient>
    <linearGradient id="professor-newton-brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eacb5a"/>
      <stop offset="1" stop-color="#8a6d1d"/>
    </linearGradient>
    <radialGradient id="professor-newton-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>

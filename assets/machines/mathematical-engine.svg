<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384" role="img">
<title>The Mathematical Engine core: a dormant orb of nested brass and stone rings and gears on a stone pedestal, its centre dark and cracked with a few faint sparks</title>
<defs>
<radialGradient id="mathematical-engine-core" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#16324a"/><stop offset="0.35" stop-color="#0b1020"/><stop offset="1" stop-color="#05070d"/></radialGradient>
<radialGradient id="mathematical-engine-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<radialGradient id="mathematical-engine-spark" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffb347" stop-opacity="0.8"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
<linearGradient id="mathematical-engine-brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9a227"/><stop offset="0.5" stop-color="#8a6d1d"/><stop offset="1" stop-color="#4a3a10"/></linearGradient>
<linearGradient id="mathematical-engine-iron" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b7280"/><stop offset="1" stop-color="#2b3040"/></linearGradient>
<linearGradient id="mathematical-engine-stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c566a"/><stop offset="1" stop-color="#232838"/></linearGradient>
<linearGradient id="mathematical-engine-orb" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#4c566a"/><stop offset="0.5" stop-color="#2b3040"/><stop offset="1" stop-color="#151827"/></linearGradient>
</defs>
<!-- pedestal -->
<ellipse cx="256" cy="366" rx="150" ry="14" fill="#05070d" opacity="0.5"/>
<g stroke="#151827" stroke-width="2">
<path d="M150 360 L170 320 H342 L362 360 Z" fill="url(#mathematical-engine-stone)"/>
<rect x="186" y="300" width="140" height="22" fill="#3b4252"/>
<path d="M200 300 Q 256 270 312 300 Z" fill="#2b3040"/>
</g>
<g fill="#2dd4bf" opacity="0.25"><rect x="226" y="336" width="12" height="4"/><rect x="250" y="332" width="4" height="14"/><rect x="274" y="336" width="12" height="4"/><rect x="200" y="308" width="8" height="3"/><rect x="304" y="308" width="8" height="3"/></g>
<!-- faint core glow -->
<circle cx="256" cy="180" r="120" fill="url(#mathematical-engine-glow)"/>
<!-- orb body -->
<circle cx="256" cy="180" r="118" fill="url(#mathematical-engine-orb)" stroke="#151827" stroke-width="3"/>
<!-- outer toothed ring -->
<circle cx="256" cy="180" r="130" fill="none" stroke="#4a3a10" stroke-width="18" stroke-dasharray="12 9"/>
<circle cx="256" cy="180" r="122" fill="none" stroke="url(#mathematical-engine-brass)" stroke-width="10"/>
<circle cx="256" cy="180" r="122" fill="none" stroke="#e0c25a" stroke-width="1.5" opacity="0.35"/>
<!-- tilted gyroscope rings -->
<ellipse cx="256" cy="180" rx="112" ry="40" fill="none" stroke="url(#mathematical-engine-iron)" stroke-width="9" transform="rotate(-28 256 180)"/>
<ellipse cx="256" cy="180" rx="112" ry="40" fill="none" stroke="#151827" stroke-width="1.5" transform="rotate(-28 256 180)"/>
<ellipse cx="256" cy="180" rx="100" ry="34" fill="none" stroke="url(#mathematical-engine-brass)" stroke-width="7" transform="rotate(34 256 180)"/>
<g fill="#c9a227" opacity="0.8"><circle cx="160" cy="130" r="3"/><circle cx="352" cy="230" r="3"/><circle cx="330" cy="120" r="3"/><circle cx="182" cy="240" r="3"/></g>
<!-- inner iron ring with rivets -->
<circle cx="256" cy="180" r="84" fill="none" stroke="url(#mathematical-engine-iron)" stroke-width="12"/>
<g fill="#a3a8b4" opacity="0.7"><circle cx="256" cy="96" r="2.5"/><circle cx="340" cy="180" r="2.5"/><circle cx="256" cy="264" r="2.5"/><circle cx="172" cy="180" r="2.5"/><circle cx="315" cy="121" r="2.5"/><circle cx="197" cy="239" r="2.5"/><circle cx="315" cy="239" r="2.5"/><circle cx="197" cy="121" r="2.5"/></g>
<!-- inner gear -->
<circle cx="256" cy="180" r="64" fill="none" stroke="#5a4713" stroke-width="12" stroke-dasharray="8 6"/>
<circle cx="256" cy="180" r="58" fill="#2a2010" stroke="#8a6d1d" stroke-width="4"/>
<g stroke="#8a6d1d" stroke-width="7" stroke-linecap="round"><line x1="256" y1="130" x2="256" y2="150"/><line x1="256" y1="210" x2="256" y2="230"/><line x1="206" y1="180" x2="226" y2="180"/><line x1="286" y1="180" x2="306" y2="180"/><line x1="221" y1="145" x2="235" y2="159"/><line x1="291" y1="215" x2="277" y2="201"/><line x1="291" y1="145" x2="277" y2="159"/><line x1="221" y1="215" x2="235" y2="201"/></g>
<!-- dead centre -->
<circle cx="256" cy="180" r="40" fill="url(#mathematical-engine-core)" stroke="#8a6d1d" stroke-width="3"/>
<circle cx="256" cy="180" r="10" fill="#2dd4bf" opacity="0.14"/>
<circle cx="256" cy="180" r="4" fill="#2dd4bf" opacity="0.35"/>
<!-- cracks -->
<g fill="none" stroke="#05070d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M256 140 L 250 156 L 258 170 L 252 184"/><path d="M296 160 L 282 168 L 278 180"/><path d="M180 110 L 196 128 L 192 146"/><path d="M330 240 L 314 232 L 306 214"/><path d="M226 292 L 236 272 L 232 258"/>
</g>
<g fill="none" stroke="#6b7280" stroke-width="1" opacity="0.5"><path d="M258 140 L 252 156 L 260 170 L 254 184"/><path d="M182 110 L 198 128 L 194 146"/></g>
<!-- rune notches (dim) -->
<g fill="#2dd4bf" opacity="0.22"><rect x="252" y="66" width="8" height="10"/><rect x="252" y="284" width="8" height="10"/><rect x="140" y="176" width="10" height="8"/><rect x="362" y="176" width="10" height="8"/></g>
<!-- faint sparks -->
<circle cx="300" cy="150" r="10" fill="url(#mathematical-engine-spark)"/><circle cx="300" cy="150" r="1.6" fill="#fff1c7"/>
<circle cx="212" cy="212" r="8" fill="url(#mathematical-engine-spark)"/><circle cx="212" cy="212" r="1.3" fill="#fff1c7"/>
<circle cx="270" cy="250" r="7" fill="url(#mathematical-engine-spark)"/><circle cx="270" cy="250" r="1.2" fill="#ffb347"/>
<g fill="none" stroke="#ffb347" stroke-width="1" opacity="0.6"><path d="M300 150 L 308 144 L 312 148"/><path d="M212 212 L 204 218"/></g>
<!-- highlight -->
<path d="M170 110 A 118 118 0 0 1 240 66" fill="none" stroke="#a3a8b4" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
</svg>

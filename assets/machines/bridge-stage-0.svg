<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384" role="img">
<title>Bridge stage 0: a collapsed stone-and-iron bridge across a chasm, only two abutments and rubble remain</title>
<defs>
<linearGradient id="bridge-stage-0-cliff" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c566a"/><stop offset="1" stop-color="#1c2130"/></linearGradient>
<linearGradient id="bridge-stage-0-chasm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151827" stop-opacity="0.2"/><stop offset="1" stop-color="#05070d"/></linearGradient>
<linearGradient id="bridge-stage-0-stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b7280"/><stop offset="1" stop-color="#3b4252"/></linearGradient>
<linearGradient id="bridge-stage-0-iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b7280"/><stop offset="1" stop-color="#232838"/></linearGradient>
<linearGradient id="bridge-stage-0-deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a8f9c"/><stop offset="0.5" stop-color="#4c566a"/><stop offset="1" stop-color="#2b3040"/></linearGradient>
<linearGradient id="bridge-stage-0-brass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6d1d"/><stop offset="0.5" stop-color="#c9a227"/><stop offset="1" stop-color="#8a6d1d"/></linearGradient>
<radialGradient id="bridge-stage-0-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffb347" stop-opacity="0.7"/><stop offset="0.4" stop-color="#ffb347" stop-opacity="0.25"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
</defs>
<!-- chasm -->
<path d="M120 200 Q 180 260 200 384 L 312 384 Q 332 260 392 200 Z" fill="url(#bridge-stage-0-chasm)"/>
<!-- cliffs -->
<g stroke="#151827" stroke-width="2.5">
<path d="M0 384 V 190 L 20 176 H 118 L 128 196 Q 168 250 192 330 Q 200 360 196 384 Z" fill="url(#bridge-stage-0-cliff)"/>
<path d="M512 384 V 190 L 492 176 H 394 L 384 196 Q 344 250 320 330 Q 312 360 316 384 Z" fill="url(#bridge-stage-0-cliff)"/>
</g>
<g fill="none" stroke="#151827" stroke-width="1.5" opacity="0.7"><path d="M30 230 L 70 240 L 90 280 M40 300 L 100 310 L 130 350 M150 250 L 170 300"/><path d="M482 230 L 442 240 L 422 280 M472 300 L 412 310 L 382 350 M362 250 L 342 300"/></g>
<!-- abutments -->
<g stroke="#151827" stroke-width="2.5">
<rect x="64" y="150" width="70" height="90" fill="url(#bridge-stage-0-stone)"/>
<rect x="378" y="150" width="70" height="90" fill="url(#bridge-stage-0-stone)"/>
<rect x="56" y="140" width="86" height="14" fill="#6b7280"/><rect x="370" y="140" width="86" height="14" fill="#6b7280"/>
</g>
<g fill="none" stroke="#232838" stroke-width="1.5"><path d="M64 180 H134 M64 210 H134 M100 154 V180 M82 180 V210 M116 180 V210 M100 210 V240"/><path d="M378 180 H448 M378 210 H448 M414 154 V180 M396 180 V210 M430 180 V210 M414 210 V240"/></g>
<g fill="#2dd4bf" opacity="0.35"><rect x="94" y="190" width="12" height="3"/><rect x="98" y="196" width="4" height="10"/><rect x="406" y="190" width="12" height="3"/><rect x="410" y="196" width="4" height="10"/></g>
<!-- rubble -->
<g fill="#3b4252" stroke="#151827" stroke-width="2">
<polygon points="134,150 176,146 190,168 168,184 140,178"/><polygon points="378,150 336,146 322,168 344,184 372,178"/>
<polygon points="200,330 228,318 250,340 236,362 206,356"/><polygon points="312,330 284,318 262,340 276,362 306,356"/><polygon points="240,370 262,360 282,372 270,384 244,384"/>
<polygon points="170,260 190,250 204,270 186,284"/><polygon points="342,260 322,250 308,270 326,284"/>
</g>
<g fill="none" stroke="#6b7280" stroke-width="5" stroke-linecap="round" opacity="0.8"><path d="M176 158 L 212 176 M336 158 L 300 176"/></g>
<g fill="none" stroke="#232838" stroke-width="2"><path d="M140 168 L 160 176 M348 168 L 328 176 M226 340 L 240 350"/></g>
</svg>

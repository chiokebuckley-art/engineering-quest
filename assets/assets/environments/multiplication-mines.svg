<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img">
<title>Multiplication Mines: a timber-braced mine tunnel with rail track running into darkness, glowing amber ore veins, teal crystals, hanging lanterns and a minecart</title>
<defs>
<linearGradient id="multiplication-mines-rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f3f"/><stop offset="1" stop-color="#171a26"/></linearGradient>
<linearGradient id="multiplication-mines-rockL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b4252"/><stop offset="1" stop-color="#1c202c"/></linearGradient>
<linearGradient id="multiplication-mines-rockR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#3b4252"/><stop offset="1" stop-color="#1c202c"/></linearGradient>
<radialGradient id="multiplication-mines-tunnel" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#05070d"/><stop offset="0.55" stop-color="#0b0e18"/><stop offset="1" stop-color="#1c202c"/></radialGradient>
<linearGradient id="multiplication-mines-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20242f"/><stop offset="1" stop-color="#3a3428"/></linearGradient>
<radialGradient id="multiplication-mines-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffb347" stop-opacity="0.7"/><stop offset="0.4" stop-color="#ffb347" stop-opacity="0.22"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
<radialGradient id="multiplication-mines-tglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.5"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<linearGradient id="multiplication-mines-wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a3421"/><stop offset="0.5" stop-color="#6b4a2e"/><stop offset="1" stop-color="#3a2818"/></linearGradient>
<linearGradient id="multiplication-mines-crys" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8f5ea"/><stop offset="0.5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
<linearGradient id="multiplication-mines-cart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b7280"/><stop offset="1" stop-color="#3b4252"/></linearGradient>

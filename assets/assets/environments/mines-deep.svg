<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img">
<title>Deep Mines: a dark cavern thick with teal crystals, lava glow seeping at the lower edges, ancient brass machinery embedded in the rock and a huge half-buried gear</title>
<defs>
<linearGradient id="mines-deep-rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0e18"/><stop offset="0.6" stop-color="#171a26"/><stop offset="1" stop-color="#241d1c"/></linearGradient>
<radialGradient id="mines-deep-tunnel" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#03040a"/><stop offset="0.6" stop-color="#090c14"/><stop offset="1" stop-color="#171a26"/></radialGradient>
<radialGradient id="mines-deep-lava" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff6a1a" stop-opacity="0.8"/><stop offset="0.4" stop-color="#ef4444" stop-opacity="0.35"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
<radialGradient id="mines-deep-tglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<radialGradient id="mines-deep-aglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffb347" stop-opacity="0.6"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
<linearGradient id="mines-deep-crys" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8fff4"/><stop offset="0.45" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0b4f4a"/></linearGradient>
<linearGradient id="mines-deep-brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9a227"/><stop offset="0.5" stop-color="#8a6d1d"/><stop offset="1" stop-color="#4a3a10"/></linearGradient>
<linearGradient id="mines-deep-iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c566a"/><stop offset="1" stop-color="#232838"/></linearGradient>
<linearGradient id="mines-deep-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1d28"/><stop offset="1" stop-color="#2c211d"/></linearGradient>
<linearGradient id="mines-deep-lavaflow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb347"/><stop offset="0.5" stop-color="#ff6a1a"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
</defs>
<rect width="1280" height="720" fill="url(#mines-deep-rock)"/>

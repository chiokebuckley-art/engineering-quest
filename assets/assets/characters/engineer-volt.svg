  <path d="M129 116 Q127 123 125 128 Q129 131 134 128" fill="none" stroke="#1a0d05" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M117 141 Q129 148 141 141" fill="none" stroke="#1a0d05" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M120 144 Q129 147 138 144" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.2"/>
  <path d="M104 150 Q118 160 128 160 Q138 160 152 150" fill="none" stroke="#1a0d05" stroke-opacity="0.4" stroke-width="1.2"/>

  <circle cx="113" cy="112" r="13" fill="url(#engineer-volt-glow)"/>
  <circle cx="145" cy="112" r="13" fill="url(#engineer-volt-glow)"/>
  <circle cx="113" cy="112" r="11" fill="#1f2633" stroke="#0b1020" stroke-width="2"/>
  <circle cx="145" cy="112" r="11" fill="#1f2633" stroke="#0b1020" stroke-width="2"/>
  <circle cx="113" cy="112" r="8" fill="url(#engineer-volt-lens)" stroke="#e8b422" stroke-width="1.5"/>
  <circle cx="145" cy="112" r="8" fill="url(#engineer-volt-lens)" stroke="#e8b422" stroke-width="1.5"/>
  <circle cx="113.5" cy="112.5" r="2.4" fill="#0b1020" fill-opacity="0.7"/>
  <circle cx="145.5" cy="112.5" r="2.4" fill="#0b1020" fill-opacity="0.7"/>
  <path d="M108 107 Q111 104.5 115 105" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="1.4"/>
  <path d="M140 107 Q143 104.5 147 105" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="1.4"/>
  <path d="M124 111 L134 111" fill="none" stroke="#6b7280" stroke-width="3"/>

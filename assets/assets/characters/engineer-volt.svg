<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img">
  <title>Engineer Volt, electrical engineering teacher: a dark-skinned engineer with a shaved head, cyan-lit goggles and an insulated jacket bearing a lightning-bolt shoulder badge</title>
  <defs>
    <radialGradient id="engineer-volt-bg" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0b1020"/>
    </radialGradient>
    <linearGradient id="engineer-volt-skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a4a2c"/>
      <stop offset="1" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="engineer-volt-jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c566a"/>
      <stop offset="1" stop-color="#232a38"/>
    </linearGradient>
    <linearGradient id="engineer-volt-collar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b422"/>
      <stop offset="1" stop-color="#8a6d1d"/>
    </linearGradient>
    <radialGradient id="engineer-volt-lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#d9fbff"/>
      <stop offset="0.35" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e6f80"/>
    </radialGradient>
    <radialGradient id="engineer-volt-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <polygon points="128,18 214.6,68 214.6,168 128,218 41.4,168 41.4,68" fill="url(#engineer-volt-bg)" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="128,28 206,73 206,163 128,208 50,163 50,73" fill="none" stroke="#22d3ee" stroke-opacity="0.18" stroke-linejoin="round"/>
  <!-- insulated jacket -->
  <path d="M28 256 L28 236 Q32 202 72 188 L112 174 L144 174 L184 188 Q224 202 228 236 L228 256 Z" fill="url(#engineer-volt-jacket)" stroke="#0b1020" stroke-width="2"/>

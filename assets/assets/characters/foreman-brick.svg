  <path d="M102 118 Q108 122 118 120 M154 118 Q148 122 138 120" fill="none" stroke="#6b4a30" stroke-opacity="0.4" stroke-width="1.2"/>
  <!-- broad nose -->
  <path d="M129 110 Q126 122 122 128 Q129 133 136 128" fill="none" stroke="#7a4a2a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- thick moustache and mouth -->
  <path d="M120 144 Q128 148 136 144" fill="none" stroke="#3a1a10" stroke-width="2"/>
  <path d="M102 138 Q112 128 128 134 Q144 128 154 138 Q150 146 140 144 Q134 140 128 140 Q122 140 116 144 Q106 146 102 138 Z" fill="url(#foreman-brick-hair)" stroke="#2e1a0c" stroke-width="1.5"/>
  <path d="M108 136 Q116 132 126 136" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="1.2"/>

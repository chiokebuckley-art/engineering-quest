  <rect x="116" y="62" width="24" height="20" rx="3" fill="#3b4252" stroke="#0b1020" stroke-width="1.5"/>
  <circle cx="128" cy="72" r="7" fill="#fff7d6" stroke="#8a6d1d" stroke-width="1.5"/>
  <circle cx="128" cy="72" r="3" fill="#ffb347"/>

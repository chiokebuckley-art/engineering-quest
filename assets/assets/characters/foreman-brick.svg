<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img">
  <title>Foreman Brick, mine foreman and quest giver: a burly man with a thick moustache, a mining helmet with a lit lamp, and suspenders over a work shirt</title>
  <defs>
    <radialGradient id="foreman-brick-bg" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.36"/>
      <stop offset="0.6" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0b1020"/>
    </radialGradient>
    <linearGradient id="foreman-brick-skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6b490"/>
      <stop offset="1" stop-color="#a86f4a"/>
    </linearGradient>
    <linearGradient id="foreman-brick-helmet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c040"/>
      <stop offset="1" stop-color="#8a6010"/>
    </linearGradient>
    <linearGradient id="foreman-brick-shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a0704a"/>
      <stop offset="1" stop-color="#5c3d22"/>
    </linearGradient>
    <linearGradient id="foreman-brick-strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c3120"/>
      <stop offset="1" stop-color="#2a1a0e"/>
    </linearGradient>
    <linearGradient id="foreman-brick-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4a30"/>
      <stop offset="1" stop-color="#2e1a0c"/>
    </linearGradient>
    <radialGradient id="foreman-brick-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.3" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="118" r="100" fill="url(#foreman-brick-bg)" stroke="#ffb347" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="128" cy="118" r="92" fill="none" stroke="#ffb347" stroke-opacity="0.18"/>

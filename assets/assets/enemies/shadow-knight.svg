<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img">
  <title>Shadow Knight: an armoured knight of dark iron with a violet glowing visor, a cape of smoke and a rune-etched greatsword</title>
  <defs>
    <linearGradient id="shadow-knight-armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6478"/>
      <stop offset="0.45" stop-color="#2b3140"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="shadow-knight-armor2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f4658"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="shadow-knight-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="0.5" stop-color="#6b7280"/>
      <stop offset="1" stop-color="#2b3140"/>
    </linearGradient>
    <linearGradient id="shadow-knight-smoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a6b" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#1e1440" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow-knight-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shadow-knight-violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <radialGradient id="shadow-knight-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b1020" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="124" cy="234" rx="96" ry="12" fill="url(#shadow-knight-shadow)"/>

  <!-- smoke cape -->
  <path d="M84 84 C60 110 40 150 30 200 C26 216 34 226 44 220 C50 232 62 236 70 224 C76 238 90 240 96 226 C104 236 116 232 118 220 L160 130 C156 108 148 92 152 84 Z"
        fill="url(#shadow-knight-smoke)"/>
  <path d="M60 130 C48 160 40 190 36 214 M78 120 C66 150 60 186 58 222" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.2"/>
  <g fill="#a78bfa" opacity="0.35">
    <circle cx="40" cy="176" r="2"/><circle cx="52" cy="206" r="1.6"/><circle cx="30" cy="150" r="1.4"/><circle cx="66" cy="226" r="1.8"/>
  </g>

  <!-- greatsword (behind body, held on viewer's right) -->
  <g>
    <path d="M190 10 L206 30 L204 156 L192 156 L190 30 Z" fill="url(#shadow-knight-blade)" stroke="#0b1020" stroke-width="2" stroke-linejoin="round"/>
    <path d="M198 30 L198 154" stroke="#0b1020" stroke-width="1.2" opacity="0.6"/>
    <!-- runes along blade -->
    <path d="M198 40 L198 140" stroke="#a78bfa" stroke-width="6" opacity="0.25" stroke-linecap="round"/>
    <g stroke="url(#shadow-knight-violet)" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M195 46 L201 46 M198 42 L198 52"/>
      <path d="M195 62 L201 68 M201 62 L195 68"/>
      <path d="M195 82 L201 82 L198 90 Z"/>
      <path d="M198 100 L198 112 M194 106 L202 106"/>
      <path d="M195 124 L201 130 M195 130 L201 124"/>
    </g>
    <!-- crossguard -->
    <path d="M170 152 L226 152 L230 162 L166 162 Z" fill="url(#shadow-knight-armor)" stroke="#0b1020" stroke-width="2"/>
    <circle cx="198" cy="157" r="5" fill="#a78bfa" stroke="#0b1020" stroke-width="1.2"/>
    <!-- grip and pommel -->
    <rect x="193" y="162" width="10" height="36" fill="#1a1030" stroke="#0b1020" stroke-width="1.8"/>
    <path d="M193 168 L203 172 M193 178 L203 182 M193 188 L203 192" stroke="#4c3d80" stroke-width="1.5"/>
    <circle cx="198" cy="204" r="7" fill="url(#shadow-knight-armor)" stroke="#0b1020" stroke-width="2"/>
  </g>

  <!-- legs -->
  <path d="M92 168 L116 168 L114 222 L92 224 Z" fill="url(#shadow-knight-armor2)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M130 168 L154 168 L156 222 L134 224 Z" fill="url(#shadow-knight-armor2)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M96 192 L114 190 M132 190 L152 192" stroke="#0b1020" stroke-width="2"/>
  <!-- boots -->
  <path d="M86 220 L116 218 L118 234 L82 236 Z" fill="url(#shadow-knight-armor)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M132 218 L162 220 L166 236 L130 234 Z" fill="url(#shadow-knight-armor)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- tasset / skirt plates -->
  <path d="M84 150 L164 150 L170 176 L150 172 L124 180 L98 172 L78 176 Z" fill="url(#shadow-knight-armor2)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M104 152 L100 172 M124 152 L124 180 M144 152 L148 172" stroke="#0b1020" stroke-width="1.6"/>

  <!-- torso -->
  <path d="M84 96 L164 96 L168 130 L160 156 L88 156 L80 130 Z" fill="url(#shadow-knight-armor)" stroke="#0b1020" stroke-width="3" stroke-linejoin="round"/>
  <path d="M124 98 L124 154" stroke="#0b1020" stroke-width="1.6" opacity="0.8"/>
  <path d="M96 110 L118 122 L118 146 M152 110 L130 122 L130 146" fill="none" stroke="#0b1020" stroke-width="1.6" opacity="0.8"/>
  <!-- chest rune -->
  <circle cx="124" cy="126" r="16" fill="url(#shadow-knight-glow)"/>
  <path d="M118 120 L130 132 M130 120 L118 132" stroke="url(#shadow-knight-violet)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- belt -->
  <rect x="84" y="148" width="80" height="8" fill="#1a1030" stroke="#0b1020" stroke-width="1.5"/>
  <rect x="118" y="146" width="12" height="12" rx="1" fill="#6b7280" stroke="#0b1020" stroke-width="1.2"/>

  <!-- left arm (viewer's left) -->
  <path d="M84 100 C68 112 60 132 60 156 L78 158 C78 140 84 126 96 118 Z" fill="url(#shadow-knight-armor2)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M56 154 L82 152 L84 174 L58 176 Z" fill="url(#shadow-knight-armor)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M60 176 L84 174 L82 190 L62 192 Z" fill="url(#shadow-knight-armor2)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- right arm reaching to sword grip -->
  <path d="M164 100 C180 112 188 130 188 150 L206 150 C204 128 196 108 182 96 Z" fill="url(#shadow-knight-armor2)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M184 162 L212 160 L214 184 L184 186 Z" fill="url(#shadow-knight-armor)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M188 168 L210 168 M188 176 L210 176" stroke="#0b1020" stroke-width="1.5"/>

  <!-- pauldrons -->
  <path d="M60 104 C70 84 96 84 104 100 L104 112 C90 108 76 110 66 118 Z" fill="url(#shadow-knight-armor)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M188 104 C178 84 152 84 144 100 L144 112 C158 108 172 110 182 118 Z" fill="url(#shadow-knight-armor)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- pauldron spikes -->
  <path d="M66 96 L52 70 L74 88 Z M78 90 L72 66 L88 86 Z" fill="url(#shadow-knight-armor2)" stroke="#0b1020" stroke-width="2" stroke-linejoin="round"/>
  <path d="M182 96 L196 70 L174 88 Z M170 90 L176 66 L160 86 Z" fill="url(#shadow-knight-armor2)" stroke="#0b1020" stroke-width="2" stroke-linejoin="round"/>

  <!-- gorget -->
  <path d="M104 92 L144 92 L140 102 L108 102 Z" fill="#1a1030" stroke="#0b1020" stroke-width="2"/>

  <!-- helmet -->
  <path d="M98 66 C98 42 110 30 124 30 C138 30 150 42 150 66 L150 92 L98 92 Z" fill="url(#shadow-knight-armor)" stroke="#0b1020" stroke-width="3" stroke-linejoin="round"/>
  <path d="M124 30 L124 92" stroke="#0b1020" stroke-width="1.6" opacity="0.8"/>
  <!-- crest -->
  <path d="M120 32 L124 12 L128 32 Z" fill="url(#shadow-knight-armor2)" stroke="#0b1020" stroke-width="2"/>
  <!-- visor -->
  <path d="M100 62 L148 62 L146 74 L102 74 Z" fill="#0b1020"/>
  <ellipse cx="124" cy="68" rx="28" ry="10" fill="url(#shadow-knight-glow)"/>
  <path d="M104 66 L120 66 M128 66 L144 66" stroke="url(#shadow-knight-violet)" stroke-width="3" stroke-linecap="round"/>
  <!-- breath slits -->
  <path d="M112 80 L112 88 M118 80 L118 88 M130 80 L130 88 M136 80 L136 88" stroke="#0b1020" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img">
  <title>Fraction Sprite: a floating pie-shaped forest spirit cut into four equal slices, three of them glowing, with leaf wings</title>
  <defs>
    <radialGradient id="fs-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#bef264" stop-opacity="0.55"/><stop offset="1" stop-color="#bef264" stop-opacity="0"/></radialGradient>
    <linearGradient id="fs-lit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="fs-dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#365314"/><stop offset="1" stop-color="#1a2e05"/></linearGradient>
    <linearGradient id="fs-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#15803d"/></linearGradient>
    <radialGradient id="fs-shadow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#000" stop-opacity="0.45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="128" cy="232" rx="62" ry="12" fill="url(#fs-shadow)"/>
  <circle cx="128" cy="120" r="112" fill="url(#fs-glow)"/>
  <!-- leaf wings -->
  <path d="M60 110 C 18 78, 10 132, 44 150 C 58 142, 62 128, 60 110 Z" fill="url(#fs-leaf)" stroke="#14532d" stroke-width="3"/>
  <path d="M196 110 C 238 78, 246 132, 212 150 C 198 142, 194 128, 196 110 Z" fill="url(#fs-leaf)" stroke="#14532d" stroke-width="3"/>
  <path d="M34 124 L 58 124 M 222 124 L 198 124" stroke="#14532d" stroke-width="2" opacity="0.6"/>
  <!-- the pie: four equal slices, three lit -->
  <g stroke="#0f172a" stroke-width="4" stroke-linejoin="round">
    <path d="M128 124 L 128 54 A 70 70 0 0 1 198 124 Z" fill="url(#fs-lit)"/>
    <path d="M128 124 L 198 124 A 70 70 0 0 1 128 194 Z" fill="url(#fs-lit)"/>
    <path d="M128 124 L 128 194 A 70 70 0 0 1 58 124 Z" fill="url(#fs-lit)"/>
    <path d="M128 124 L 58 124 A 70 70 0 0 1 128 54 Z" fill="url(#fs-dark)"/>
  </g>
  <circle cx="128" cy="124" r="70" fill="none" stroke="#fef3c7" stroke-opacity="0.35" stroke-width="2"/>
  <!-- face on the lit slices -->
  <ellipse cx="150" cy="104" rx="9" ry="11" fill="#0f172a"/><circle cx="153" cy="100" r="3.5" fill="#fff"/>
  <ellipse cx="174" cy="132" rx="8" ry="10" fill="#0f172a"/><circle cx="176" cy="128" r="3" fill="#fff"/>
  <path d="M142 150 Q 158 164 176 152" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <!-- the fraction it carries -->
  <g transform="translate(92 96)" font-family="Georgia, serif" font-weight="700" fill="#d9f99d" text-anchor="middle">
    <text x="0" y="0" font-size="22">3</text>
    <rect x="-11" y="6" width="22" height="3" fill="#d9f99d"/>
    <text x="0" y="30" font-size="22">4</text>
  </g>
  <!-- sparkles -->
  <g fill="#fef08a"><circle cx="46" cy="60" r="3"/><circle cx="214" cy="58" r="2.5"/><circle cx="222" cy="186" r="3"/><circle cx="36" cy="190" r="2"/></g>
</svg>

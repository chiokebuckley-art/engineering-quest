<line x1="256" y1="222" x2="256" y2="236" stroke="#6b7280" stroke-width="3"/>
<circle cx="256" cy="250" r="18" fill="#2b3040" stroke="#c9a227" stroke-width="6" stroke-dasharray="5 4"/>
<circle cx="256" cy="250" r="9" fill="none" stroke="#c9a227" stroke-width="3"/><circle cx="256" cy="250" r="3" fill="#ffb347"/>
<!-- lower windows -->
<g stroke="#2e2019" stroke-width="3">
<rect x="110" y="262" width="60" height="50" fill="url(#workshop-building-win)"/><path d="M140 262 V312 M110 287 H170"/>
<rect x="342" y="262" width="60" height="50" fill="url(#workshop-building-win)"/><path d="M372 262 V312 M342 287 H402"/>
</g>
<circle cx="140" cy="287" r="60" fill="url(#workshop-building-glow)"/><circle cx="372" cy="287" r="60" fill="url(#workshop-building-glow)"/>
<g fill="#4a3421" stroke="#151827" stroke-width="1.5"><rect x="104" y="312" width="72" height="8"/><rect x="336" y="312" width="72" height="8"/></g>
<!-- external pipe and small gear -->
<path d="M442 300 H 462 V 160 Q 462 146 476 146 H 490" fill="none" stroke="#8a6d1d" stroke-width="7" stroke-linecap="round"/>
<path d="M442 300 H 462 V 160 Q 462 146 476 146 H 490" fill="none" stroke="#c9a227" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
<circle cx="494" cy="146" r="11" fill="#2b3040" stroke="#c9a227" stroke-width="4" stroke-dasharray="3 2"/><circle cx="494" cy="146" r="3" fill="#c9a227"/>
<rect x="452" y="296" width="20" height="10" rx="2" fill="#6b7280" stroke="#151827" stroke-width="1.5"/>
<!-- lantern by door -->
<circle cx="200" cy="262" r="30" fill="url(#workshop-building-glow)"/>
<rect x="194" y="252" width="12" height="16" rx="2" fill="#8a6d1d" stroke="#3a2a10" stroke-width="1.5"/><rect x="197" y="255" width="6" height="10" fill="#ffb347"/><line x1="200" y1="240" x2="200" y2="252" stroke="#6b7280" stroke-width="2"/>
<!-- crates and barrel -->
<g stroke="#151827" stroke-width="2">
<rect x="20" y="300" width="50" height="50" fill="url(#workshop-building-timber)"/><path d="M20 300 L70 350 M70 300 L20 350" stroke="#3a2818" stroke-width="3"/>
<rect x="30" y="266" width="36" height="34" fill="url(#workshop-building-timber)"/><path d="M30 266 L66 300 M66 266 L30 300" stroke="#3a2818" stroke-width="2.5"/>
<path d="M448 350 V 296 Q 470 288 492 296 V 350 Z" fill="#4a3421"/><path d="M448 310 H492 M448 336 H492" stroke="#6b7280" stroke-width="3"/>
</g>
<!-- ground -->
<path d="M40 356 H 472" fill="none" stroke="#3b4252" stroke-width="6" stroke-linecap="round"/>
</svg>

<g stroke="#151827" stroke-width="2.5">
<polygon points="50,154 256,40 462,154" fill="url(#workshop-building-roof)"/>
<polygon points="50,154 462,154 448,166 64,166" fill="#2e2019"/>
</g>
<g fill="none" stroke="#3a2818" stroke-width="2" opacity="0.7"><path d="M90 132 L 422 132 M130 110 L 382 110 M170 88 L 342 88 M210 66 L 302 66"/></g>
<path d="M256 40 L 462 154" fill="none" stroke="#7a5637" stroke-width="3" opacity="0.5"/>
<!-- brass chimney -->
<g stroke="#3a2a10" stroke-width="2">
<rect x="340" y="60" width="34" height="80" fill="url(#workshop-building-brass)"/>
<rect x="332" y="52" width="50" height="14" rx="3" fill="#c9a227"/>
<rect x="336" y="40" width="42" height="12" rx="6" fill="#8a6d1d"/>
</g>
<g fill="#6b7280" opacity="0.35"><ellipse cx="357" cy="32" rx="12" ry="6"/><ellipse cx="366" cy="18" rx="16" ry="8"/><ellipse cx="380" cy="6" rx="20" ry="9"/></g>
<g fill="#e0c25a"><circle cx="346" cy="74" r="2"/><circle cx="368" cy="74" r="2"/><circle cx="346" cy="128" r="2"/><circle cx="368" cy="128" r="2"/></g>

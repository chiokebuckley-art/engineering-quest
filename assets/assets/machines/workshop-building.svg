<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384" role="img">
<title>Workshop building exterior: a small stone-and-timber workshop with a gabled roof, brass chimney, gear sign above the door and warmly lit windows</title>
<defs>
<linearGradient id="workshop-building-stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c566a"/><stop offset="1" stop-color="#2b3040"/></linearGradient>
<linearGradient id="workshop-building-timber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5637"/><stop offset="1" stop-color="#4a3421"/></linearGradient>
<linearGradient id="workshop-building-roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a3f2e"/><stop offset="1" stop-color="#2e2019"/></linearGradient>
<linearGradient id="workshop-building-brass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6d1d"/><stop offset="0.5" stop-color="#c9a227"/><stop offset="1" stop-color="#8a6d1d"/></linearGradient>
<radialGradient id="workshop-building-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffb347" stop-opacity="0.5"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
<linearGradient id="workshop-building-win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#e08a2a"/></linearGradient>
</defs>
<ellipse cx="256" cy="362" rx="220" ry="16" fill="#05070d" opacity="0.5"/>
<!-- stone lower wall -->
<g stroke="#151827" stroke-width="2.5">
<rect x="70" y="220" width="372" height="130" fill="url(#workshop-building-stone)"/>
<rect x="60" y="340" width="392" height="16" fill="#3b4252"/>
</g>
<g fill="none" stroke="#1a1d2a" stroke-width="1.5" opacity="0.7"><path d="M70 250 H442 M70 280 H442 M70 310 H442 M110 220 V250 M170 220 V250 M230 220 V250 M290 220 V250 M350 220 V250 M410 220 V250 M90 250 V280 M150 250 V280 M330 250 V280 M390 250 V280 M110 280 V310 M170 280 V310 M350 280 V310 M410 280 V310 M90 310 V340 M150 310 V340 M330 310 V340 M390 310 V340"/></g>
<!-- timber upper wall -->
<g stroke="#151827" stroke-width="2.5">
<rect x="70" y="150" width="372" height="72" fill="#cbbd98"/>
</g>
<g fill="#4a3421"><rect x="70" y="150" width="372" height="10"/><rect x="70" y="212" width="372" height="10"/><rect x="70" y="150" width="12" height="72"/><rect x="430" y="150" width="12" height="72"/><rect x="180" y="150" width="10" height="72"/><rect x="322" y="150" width="10" height="72"/></g>
<g stroke="#4a3421" stroke-width="8"><path d="M82 160 L 180 212 M180 160 L 82 212 M332 160 L 430 212 M430 160 L 332 212"/></g>
<!-- upper window -->
<rect x="232" y="164" width="48" height="40" fill="url(#workshop-building-win)" stroke="#2e2019" stroke-width="3"/>
<path d="M256 164 V204 M232 184 H280" stroke="#2e2019" stroke-width="3"/>
<circle cx="256" cy="184" r="50" fill="url(#workshop-building-glow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img">
  <title>Multiplication Dragon: a large mechanical dragon with dark scales, brass plating, glowing multiplication-sign runes on its spread wings and a molten glow in its throat</title>
  <defs>
    <linearGradient id="multiplication-dragon-scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b5563"/>
      <stop offset="0.45" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="multiplication-dragon-scale2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#374151"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="multiplication-dragon-membrane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2f2a"/>
      <stop offset="0.5" stop-color="#241a18"/>
      <stop offset="1" stop-color="#0f0b0c"/>
    </linearGradient>
    <linearGradient id="multiplication-dragon-membrane-r" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33282a"/>
      <stop offset="0.5" stop-color="#1f1618"/>
      <stop offset="1" stop-color="#0d090a"/>
    </linearGradient>
    <linearGradient id="multiplication-dragon-brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d060"/>
      <stop offset="0.5" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#6e5514"/>
    </linearGradient>
    <linearGradient id="multiplication-dragon-molten" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7c2d12"/>
      <stop offset="0.5" stop-color="#ef6c1c"/>
      <stop offset="1" stop-color="#ffe08a"/>
    </linearGradient>
    <radialGradient id="multiplication-dragon-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="multiplication-dragon-eye" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#9a3412"/>
    </radialGradient>
    <radialGradient id="multiplication-dragon-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b1020" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="136" cy="240" rx="100" ry="12" fill="url(#multiplication-dragon-shadow)"/>

  <!-- LEFT WING -->
  <g>
    <path d="M116 120 C92 96 60 66 10 26 C24 62 30 90 30 118 C22 122 14 128 8 140 C22 136 34 136 44 140 C42 154 44 168 50 182 C60 166 74 156 88 152 C96 140 106 128 116 120 Z"
          fill="url(#multiplication-dragon-membrane)" stroke="#080506" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- wing bones -->
    <path d="M116 120 C88 92 54 60 12 28" fill="none" stroke="#2f3540" stroke-width="6" stroke-linecap="round"/>
    <path d="M116 120 C88 92 54 60 12 28" fill="none" stroke="#5b6478" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M112 124 C82 114 50 122 10 140 M110 130 C86 132 66 150 50 180" fill="none" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
    <!-- brass wing claw -->
    <path d="M12 28 L4 18 L16 22 Z" fill="url(#multiplication-dragon-brass)" stroke="#3b2a08" stroke-width="1.2"/>
    <!-- multiplication runes -->
    <g stroke="#ffb347" stroke-width="6" opacity="0.3" stroke-linecap="round">
      <path d="M50 92 L66 108 M66 92 L50 108 M40 138 L52 150 M52 138 L40 150 M74 132 L86 144 M86 132 L74 144 M60 162 L70 172 M70 162 L60 172"/>
    </g>
    <g stroke="#ffd48a" stroke-width="2.2" stroke-linecap="round">
      <path d="M50 92 L66 108 M66 92 L50 108 M40 138 L52 150 M52 138 L40 150 M74 132 L86 144 M86 132 L74 144 M60 162 L70 172 M70 162 L60 172"/>
    </g>
  </g>

  <!-- RIGHT WING -->
  <g>
    <path d="M150 116 C176 90 208 60 248 24 C238 60 232 90 232 118 C240 122 246 130 250 142 C238 138 226 138 216 142 C218 156 214 172 206 186 C196 168 182 158 168 154 C162 140 156 128 150 116 Z"
          fill="url(#multiplication-dragon-membrane-r)" stroke="#080506" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M150 116 C178 88 210 58 246 26" fill="none" stroke="#2f3540" stroke-width="6" stroke-linecap="round"/>
    <path d="M150 116 C178 88 210 58 246 26" fill="none" stroke="#5b6478" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M154 122 C184 112 214 122 248 140 M156 128 C180 132 196 152 206 184" fill="none" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
    <path d="M246 26 L254 16 L242 20 Z" fill="url(#multiplication-dragon-brass)" stroke="#3b2a08" stroke-width="1.2"/>
    <g stroke="#ffb347" stroke-width="6" opacity="0.3" stroke-linecap="round">
      <path d="M196 90 L212 106 M212 90 L196 106 M208 138 L220 150 M220 138 L208 150 M176 132 L188 144 M188 132 L176 144 M190 164 L200 174 M200 164 L190 174"/>
    </g>
    <g stroke="#ffd48a" stroke-width="2.2" stroke-linecap="round">
      <path d="M196 90 L212 106 M212 90 L196 106 M208 138 L220 150 M220 138 L208 150 M176 132 L188 144 M188 132 L176 144 M190 164 L200 174 M200 164 L190 174"/>
    </g>
  </g>

  <!-- tail -->
  <path d="M164 196 C196 200 220 196 232 212 C238 220 232 232 222 230" fill="none" stroke="#0b1020" stroke-width="16" stroke-linecap="round"/>
  <path d="M164 196 C196 200 220 196 232 212 C238 220 232 232 222 230" fill="none" stroke="url(#multiplication-dragon-scale2)" stroke-width="11" stroke-linecap="round"/>
  <path d="M190 190 L196 182 L202 192 M208 194 L216 188 L220 200" fill="#4b5563" stroke="#0b1020" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- tail blade -->
  <path d="M222 230 L246 246 L238 220 L250 236 L246 212 Z" fill="url(#multiplication-dragon-brass)" stroke="#3b2a08" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- back legs -->
  <path d="M96 180 C82 190 78 210 80 228 L100 230 C98 214 104 202 112 196 Z" fill="url(#multiplication-dragon-scale2)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M168 176 C184 186 190 206 188 228 L168 230 C168 214 162 202 154 196 Z" fill="url(#multiplication-dragon-scale2)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- feet -->
  <path d="M72 226 L106 226 L110 238 L66 240 Z M160 226 L194 226 L198 240 L156 238 Z" fill="url(#multiplication-dragon-scale2)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="url(#multiplication-dragon-brass)" stroke="#3b2a08" stroke-width="1.2">
    <path d="M70 238 L64 248 L76 240 Z M84 240 L82 250 L92 240 Z M98 240 L100 250 L106 240 Z"/>
    <path d="M160 238 L154 248 L166 240 Z M174 240 L172 250 L182 240 Z M188 240 L190 250 L196 240 Z"/>
  </g>

  <!-- body -->
  <path d="M100 130 C90 150 88 176 100 196 C112 208 152 210 166 196 C180 176 178 150 166 130 C150 118 116 118 100 130 Z"
        fill="url(#multiplication-dragon-scale)" stroke="#0b1020" stroke-width="3" stroke-linejoin="round"/>
  <!-- brass belly plates -->
  <g fill="url(#multiplication-dragon-brass)" stroke="#3b2a08" stroke-width="1.5" stroke-linejoin="round">
    <path d="M108 150 L158 150 L154 162 L112 162 Z"/>
    <path d="M110 166 L156 166 L152 178 L114 178 Z"/>
    <path d="M114 182 L152 182 L146 194 L120 194 Z"/>
  </g>
  <!-- scale marks -->
  <path d="M100 136 C110 140 120 138 128 130 M96 156 L104 150 M170 156 L162 150 M100 184 C108 188 116 186 118 180" fill="none" stroke="#0b1020" stroke-width="1.5" opacity="0.7"/>

  <!-- front legs -->
  <path d="M104 160 C90 172 84 190 86 206 L104 206 C104 192 110 182 118 176 Z" fill="url(#multiplication-dragon-scale)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M160 160 C174 172 180 190 178 206 L160 206 C160 192 154 182 146 176 Z" fill="url(#multiplication-dragon-scale)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M80 204 L110 204 L112 216 L78 218 Z M154 204 L184 204 L186 218 L152 216 Z" fill="url(#multiplication-dragon-scale)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="url(#multiplication-dragon-brass)" stroke="#3b2a08" stroke-width="1.2">
    <path d="M80 218 L76 228 L88 218 Z M94 218 L94 228 L102 218 Z M108 216 L112 226 L114 216 Z"/>
    <path d="M154 216 L150 226 L162 216 Z M168 218 L168 228 L176 218 Z M180 216 L184 226 L186 216 Z"/>
  </g>
  <!-- brass knee joints -->
  <circle cx="98" cy="184" r="6" fill="url(#multiplication-dragon-brass)" stroke="#3b2a08" stroke-width="1.2"/>
  <circle cx="166" cy="184" r="6" fill="url(#multiplication-dragon-brass)" stroke="#3b2a08" stroke-width="1.2"/>

  <!-- neck -->
  <path d="M104 126 C96 106 84 92 74 84 L100 60 C112 76 122 100 132 118 Z" fill="url(#multiplication-dragon-scale)" stroke="#0b1020" stroke-width="3" stroke-linejoin="round"/>
  <!-- throat molten glow -->
  <circle cx="98" cy="96" r="30" fill="url(#multiplication-dragon-glow)" opacity="0.6"/>
  <path d="M98 90 C102 100 108 110 114 120 M92 96 C96 106 102 116 106 124" fill="none" stroke="url(#multiplication-dragon-molten)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <!-- neck brass plates -->
  <g fill="url(#multiplication-dragon-brass)" stroke="#3b2a08" stroke-width="1.2">
    <path d="M78 84 L92 74 L96 84 L82 92 Z"/>
    <path d="M86 96 L100 88 L104 98 L90 106 Z"/>
    <path d="M94 108 L108 100 L112 110 L98 118 Z"/>
  </g>
  <!-- dorsal spines -->
  <path d="M100 60 L106 44 L112 66 M112 74 L122 62 L124 82 M124 92 L134 84 L134 104" fill="url(#multiplication-dragon-scale2)" stroke="#0b1020" stroke-width="2" stroke-linejoin="round"/>

  <!-- head (facing left, jaws open) -->
  <path d="M40 78 C36 62 48 44 70 40 L100 52 C108 56 108 70 100 80 L74 84 Z"
        fill="url(#multiplication-dragon-scale)" stroke="#0b1020" stroke-width="3" stroke-linejoin="round"/>
  <!-- snout ridge plate -->
  <path d="M46 66 L72 48 L92 56 L84 62 L52 74 Z" fill="url(#multiplication-dragon-scale2)" stroke="#0b1020" stroke-width="1.5"/>
  <!-- mouth interior: molten -->
  <path d="M40 78 C50 80 66 82 76 84 L70 96 C56 96 44 92 36 86 Z" fill="url(#multiplication-dragon-molten)"/>
  <circle cx="54" cy="86" r="16" fill="url(#multiplication-dragon-glow)"/>
  <!-- lower jaw -->
  <path d="M36 86 C40 100 56 110 76 108 L84 96 L70 96 C56 96 44 92 36 86 Z"
        fill="url(#multiplication-dragon-scale2)" stroke="#0b1020" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- teeth -->
  <g fill="#e5e7eb" stroke="#0b1020" stroke-width="0.8">
    <path d="M44 80 L48 90 L52 81 Z M56 82 L60 92 L64 83 Z M68 84 L72 92 L74 84 Z"/>
    <path d="M44 96 L48 88 L52 96 Z M58 98 L62 90 L66 98 Z"/>
  </g>
  <!-- molten drip -->
  <path d="M48 106 C46 112 50 116 52 112 C54 108 50 104 48 106 Z" fill="#ffb347"/>
  <!-- nostril vent -->
  <path d="M42 70 L48 72" stroke="#ffb347" stroke-width="2.5" stroke-linecap="round"/>
  <!-- eye -->
  <circle cx="82" cy="62" r="12" fill="url(#multiplication-dragon-glow)"/>
  <path d="M72 62 L84 54 L92 62 L84 68 Z" fill="url(#multiplication-dragon-eye)" stroke="#0b1020" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M83 57 L83 66" stroke="#3b1a05" stroke-width="2.2"/>
  <!-- brass horns -->
  <path d="M92 46 C104 36 120 30 138 34 C122 36 112 46 104 56 Z" fill="url(#multiplication-dragon-brass)" stroke="#3b2a08" stroke-width="2" stroke-linejoin="round"/>
  <path d="M86 44 C90 32 98 24 108 22 C100 30 98 40 96 50 Z" fill="url(#multiplication-dragon-brass)" stroke="#3b2a08" stroke-width="2" stroke-linejoin="round"/>
  <!-- brass jaw hinge -->
  <circle cx="80" cy="90" r="5" fill="url(#multiplication-dragon-brass)" stroke="#3b2a08" stroke-width="1.5"/>
  <circle cx="80" cy="90" r="1.6" fill="#3b2a08"/>
</svg>

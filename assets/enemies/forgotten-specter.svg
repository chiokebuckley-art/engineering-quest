<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img">
  <title>Forgotten Specter: a faded ghost formed from torn pages and dim runes, grey-blue with a faint amber glow</title>
  <defs>
    <linearGradient id="forgotten-specter-page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6c2d4"/>
      <stop offset="0.5" stop-color="#7e8ca3"/>
      <stop offset="1" stop-color="#3f4a5e"/>
    </linearGradient>
    <linearGradient id="forgotten-specter-page2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#2f3949"/>
    </linearGradient>
    <linearGradient id="forgotten-specter-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b98ad" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#5a6678" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#3f4a5e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="forgotten-specter-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="forgotten-specter-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#94a3b8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="128" cy="130" rx="100" ry="110" fill="url(#forgotten-specter-aura)"/>

  <!-- drifting loose pages -->
  <g stroke="#2f3949" stroke-width="1.2" stroke-linejoin="round" opacity="0.8">
    <path d="M28 96 L50 90 L54 112 L44 118 L30 116 Z" fill="url(#forgotten-specter-page2)" transform="rotate(-18 40 104)"/>
    <path d="M204 70 L226 66 L228 88 L216 94 L206 90 Z" fill="url(#forgotten-specter-page2)" transform="rotate(22 216 80)"/>
    <path d="M196 178 L216 174 L218 194 L210 200 L198 196 Z" fill="url(#forgotten-specter-page2)" transform="rotate(-12 206 186)"/>
    <path d="M34 190 L52 186 L54 204 L42 208 L36 206 Z" fill="url(#forgotten-specter-page2)" transform="rotate(30 44 198)"/>
  </g>
  <g stroke="#ffb347" stroke-width="1.2" opacity="0.35" stroke-linecap="round">
    <path d="M36 100 L48 98 M36 106 L46 104 M208 76 L222 74 M208 82 L218 80 M200 186 L214 184 M40 196 L50 194"/>
  </g>

  <!-- lower body: cascading torn pages fading out -->
  <path d="M78 130 C70 160 66 190 70 214 L84 200 L92 224 L104 204 L114 232 L128 208 L140 232 L152 204 L162 226 L172 200 L186 216 C190 190 186 160 178 130 Z"
        fill="url(#forgotten-specter-fade)" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.5" stroke-linejoin="round"/>
  <!-- layered page sheets over the torso -->
  <g stroke="#2f3949" stroke-width="1.5" stroke-linejoin="round">
    <path d="M86 122 L130 116 L136 170 L120 178 L100 174 L90 180 Z" fill="url(#forgotten-specter-page)" opacity="0.92"/>
    <path d="M126 118 L172 124 L168 178 L154 172 L142 184 L130 172 Z" fill="url(#forgotten-specter-page2)" opacity="0.9"/>
    <path d="M96 156 L156 154 L158 196 L146 190 L136 202 L124 190 L110 200 L98 192 Z" fill="url(#forgotten-specter-page)" opacity="0.9"/>
  </g>
  <!-- dim rune lines on pages (faded script marks) -->
  <g stroke="#ffb347" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
    <path d="M96 132 L118 130 M98 140 L114 139 M100 148 L120 146"/>
    <path d="M136 132 L160 134 M138 142 L156 143 M140 152 L162 154"/>
    <path d="M106 166 L146 165 M108 176 L138 176 M110 186 L130 185"/>
  </g>
  <g fill="none" stroke="#ffd48a" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
    <path d="M104 128 L112 136 M112 128 L104 136"/>
    <path d="M148 138 L156 146 M156 138 L148 146"/>
    <path d="M122 168 L130 176 M130 168 L122 176"/>
  </g>

  <!-- arms: reaching, made of curled paper -->
  <path d="M86 128 C64 132 48 146 40 166 C46 160 52 156 60 156 C62 164 58 172 54 178 C66 172 78 158 88 148 Z"
        fill="url(#forgotten-specter-page2)" stroke="#2f3949" stroke-width="1.5" stroke-linejoin="round" opacity="0.9"/>
  <path d="M170 128 C192 132 208 146 216 166 C210 160 204 156 196 156 C194 164 198 172 202 178 C190 172 178 158 168 148 Z"
        fill="url(#forgotten-specter-page2)" stroke="#2f3949" stroke-width="1.5" stroke-linejoin="round" opacity="0.9"/>
  <!-- finger tatters -->
  <path d="M40 166 L30 172 M42 170 L34 180 M54 178 L50 188" stroke="#7e8ca3" stroke-width="2" stroke-linecap="round"/>
  <path d="M216 166 L226 172 M214 170 L222 180 M202 178 L206 188" stroke="#7e8ca3" stroke-width="2" stroke-linecap="round"/>

  <!-- hood / head: a folded page -->
  <circle cx="128" cy="86" r="44" fill="url(#forgotten-specter-glow)" opacity="0.7"/>
  <path d="M84 126 C80 96 92 60 128 50 C164 60 176 96 172 126 C160 118 146 116 128 118 C110 116 96 118 84 126 Z"
        fill="url(#forgotten-specter-page)" stroke="#2f3949" stroke-width="2" stroke-linejoin="round"/>
  <!-- torn top edge -->
  <path d="M110 56 L116 46 L122 56 L128 44 L134 56 L142 48 L146 58" fill="none" stroke="#2f3949" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M110 56 L116 46 L122 56 L128 44 L134 56 L142 48 L146 58 L128 62 Z" fill="#b6c2d4" opacity="0.6"/>
  <!-- fold crease -->
  <path d="M128 50 C126 76 126 100 128 118" fill="none" stroke="#3f4a5e" stroke-width="1.5" opacity="0.6"/>
  <!-- face cavity -->
  <path d="M100 96 C104 80 116 74 128 74 C140 74 152 80 156 96 C148 106 138 110 128 110 C118 110 108 106 100 96 Z" fill="#1e2532" opacity="0.85"/>
  <!-- eyes: hollow, faint amber -->
  <ellipse cx="116" cy="92" rx="10" ry="8" fill="url(#forgotten-specter-glow)"/>
  <ellipse cx="140" cy="92" rx="10" ry="8" fill="url(#forgotten-specter-glow)"/>
  <ellipse cx="116" cy="92" rx="5" ry="4" fill="#ffb347" opacity="0.75"/>
  <ellipse cx="140" cy="92" rx="5" ry="4" fill="#ffb347" opacity="0.75"/>
  <!-- mouth: torn slit -->
  <path d="M120 104 L124 108 L128 104 L132 108 L136 104" fill="none" stroke="#ffb347" stroke-width="1.5" opacity="0.5"/>
  <!-- faded rune on brow -->
  <path d="M122 64 L134 72 M134 64 L122 72" stroke="#ffd48a" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>

  <!-- floating ash motes -->
  <g fill="#e5e7eb" opacity="0.5">
    <circle cx="70" cy="70" r="1.6"/><circle cx="188" cy="110" r="1.4"/><circle cx="60" cy="150" r="1.2"/><circle cx="194" cy="150" r="1.6"/><circle cx="128" cy="236" r="1.4"/><circle cx="90" cy="224" r="1.2"/>
  </g>
</svg>

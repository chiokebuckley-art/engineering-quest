<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img">
  <title>Tunnel Goblin: a lanky mine goblin wearing a miner's headlamp and brass goggles, carrying a pickaxe</title>
  <defs>
    <linearGradient id="tunnel-goblin-skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb27a"/>
      <stop offset="0.55" stop-color="#5f8a5a"/>
      <stop offset="1" stop-color="#2f4a30"/>
    </linearGradient>
    <linearGradient id="tunnel-goblin-cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b4a3a"/>
      <stop offset="1" stop-color="#2a1f16"/>
    </linearGradient>
    <linearGradient id="tunnel-goblin-leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5a32"/>
      <stop offset="1" stop-color="#3e2612"/>
    </linearGradient>
    <linearGradient id="tunnel-goblin-brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c04a"/>
      <stop offset="1" stop-color="#8a6d1d"/>
    </linearGradient>
    <linearGradient id="tunnel-goblin-iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ca3af"/>
      <stop offset="0.5" stop-color="#6b7280"/>
      <stop offset="1" stop-color="#2f3540"/>
    </linearGradient>
    <linearGradient id="tunnel-goblin-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5e34"/>
      <stop offset="0.5" stop-color="#5c3a1c"/>
      <stop offset="1" stop-color="#3a220f"/>
    </linearGradient>
    <radialGradient id="tunnel-goblin-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.4" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tunnel-goblin-beam" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tunnel-goblin-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b1020" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="128" cy="230" rx="82" ry="12" fill="url(#tunnel-goblin-shadow)"/>

  <!-- headlamp beam (behind everything, pointing left) -->
  <polygon points="128,48 6,26 6,126" fill="url(#tunnel-goblin-beam)"/>

  <!-- pickaxe (back layer), held diagonally from low-left hand to high-right hand -->
  <g transform="rotate(49.5 137 132) translate(137 132)">
    <rect x="-5" y="-103" width="10" height="206" rx="3" fill="url(#tunnel-goblin-wood)" stroke="#2a1608" stroke-width="1.8"/>
    <rect x="-6" y="40" width="12" height="34" fill="url(#tunnel-goblin-leather)" stroke="#2a1608" stroke-width="1.5"/>
    <path d="M0 -104 C-30 -108 -58 -96 -74 -74 C-56 -86 -32 -90 0 -86 C30 -90 56 -84 72 -70 C60 -94 32 -108 0 -104 Z"
          fill="url(#tunnel-goblin-iron)" stroke="#1f242e" stroke-width="2" stroke-linejoin="round"/>
    <rect x="-9" y="-106" width="18" height="30" rx="3" fill="url(#tunnel-goblin-iron)" stroke="#1f242e" stroke-width="1.8"/>
    <circle cx="0" cy="-98" r="2.5" fill="#c9a227"/>
    <circle cx="0" cy="-84" r="2.5" fill="#c9a227"/>
  </g>

  <!-- left (far) leg -->
  <path d="M138 172 L154 176 L160 214 L148 216 L136 186 Z" fill="url(#tunnel-goblin-skin)" stroke="#1e2f1e" stroke-width="2"/>
  <path d="M144 212 L164 210 L172 226 L142 228 Z" fill="url(#tunnel-goblin-leather)" stroke="#2a1608" stroke-width="2"/>

  <!-- torso -->
  <path d="M96 118 C88 130 84 152 90 176 L146 174 C154 150 152 128 140 112 Z"
        fill="url(#tunnel-goblin-skin)" stroke="#1e2f1e" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- ribs / shading -->
  <path d="M104 140 C112 146 124 148 136 144 M104 152 C112 158 124 160 136 156" fill="none" stroke="#2f4a30" stroke-width="1.5" opacity="0.6"/>

  <!-- ragged trousers -->
  <path d="M88 170 C86 192 92 204 96 210 L112 206 L118 190 L128 206 L146 208 C150 196 150 180 148 170 Z"
        fill="url(#tunnel-goblin-cloth)" stroke="#1a120a" stroke-width="2" stroke-linejoin="round"/>
  <!-- belt -->
  <rect x="88" y="168" width="60" height="9" fill="url(#tunnel-goblin-leather)" stroke="#2a1608" stroke-width="1.5"/>
  <rect x="112" y="166" width="12" height="13" rx="2" fill="url(#tunnel-goblin-brass)" stroke="#5c4a12" stroke-width="1.2"/>

  <!-- near leg -->
  <path d="M96 208 L106 208 L102 228 L84 232 L86 224 Z" fill="url(#tunnel-goblin-skin)" stroke="#1e2f1e" stroke-width="2"/>
  <path d="M74 226 L108 224 L110 236 L70 238 Z" fill="url(#tunnel-goblin-leather)" stroke="#2a1608" stroke-width="2"/>

  <!-- leather straps crossing chest -->
  <path d="M96 118 L146 172" stroke="url(#tunnel-goblin-leather)" stroke-width="10" fill="none"/>
  <path d="M96 118 L146 172" stroke="#2a1608" stroke-width="1.2" fill="none"/>
  <path d="M138 114 L92 172" stroke="url(#tunnel-goblin-leather)" stroke-width="10" fill="none"/>
  <path d="M138 114 L92 172" stroke="#2a1608" stroke-width="1.2" fill="none"/>
  <rect x="110" y="136" width="14" height="14" rx="2" fill="url(#tunnel-goblin-brass)" stroke="#5c4a12" stroke-width="1.2"/>
  <circle cx="102" cy="128" r="2" fill="#c9a227"/>
  <circle cx="134" cy="126" r="2" fill="#c9a227"/>
  <!-- pouch -->
  <path d="M144 160 L162 158 L166 180 L146 182 Z" fill="url(#tunnel-goblin-leather)" stroke="#2a1608" stroke-width="1.8"/>

  <!-- far arm (holding pickaxe handle high) -->
  <path d="M138 118 C160 108 178 96 186 84 L196 92 C186 110 166 126 146 132 Z"
        fill="url(#tunnel-goblin-skin)" stroke="#1e2f1e" stroke-width="2" stroke-linejoin="round"/>
  <path d="M184 78 L200 74 L206 88 L194 98 L184 92 Z" fill="url(#tunnel-goblin-skin)" stroke="#1e2f1e" stroke-width="2"/>

  <!-- near arm (long, hanging, gripping low handle) -->
  <path d="M98 122 C84 138 74 158 64 178 L80 188 C88 168 98 150 110 138 Z"
        fill="url(#tunnel-goblin-skin)" stroke="#1e2f1e" stroke-width="2" stroke-linejoin="round"/>
  <path d="M60 178 L84 176 L90 190 L80 200 L62 196 Z" fill="url(#tunnel-goblin-skin)" stroke="#1e2f1e" stroke-width="2"/>
  <!-- claws -->
  <path d="M64 196 L58 204 M72 199 L68 208 M80 200 L78 208" stroke="#1e2f1e" stroke-width="2" stroke-linecap="round"/>

  <!-- neck -->
  <path d="M112 100 L128 100 L134 116 L110 118 Z" fill="url(#tunnel-goblin-skin)" stroke="#1e2f1e" stroke-width="2"/>

  <!-- ears -->
  <path d="M84 78 C60 60 44 60 40 68 C56 72 74 84 88 92 Z" fill="url(#tunnel-goblin-skin)" stroke="#1e2f1e" stroke-width="2" stroke-linejoin="round"/>
  <path d="M170 78 C190 58 208 60 214 68 C198 72 180 84 166 92 Z" fill="url(#tunnel-goblin-skin)" stroke="#1e2f1e" stroke-width="2" stroke-linejoin="round"/>

  <!-- head -->
  <path d="M88 82 C88 60 108 46 128 46 C150 46 168 60 168 82 C168 100 152 112 132 114 C112 116 92 104 88 82 Z"
        fill="url(#tunnel-goblin-skin)" stroke="#1e2f1e" stroke-width="2.2"/>
  <!-- nose -->
  <path d="M126 82 C118 90 116 98 122 100 C128 102 134 98 132 92 Z" fill="#4c7048" stroke="#1e2f1e" stroke-width="1.8"/>
  <!-- eyes -->
  <ellipse cx="110" cy="84" rx="9" ry="6" fill="#ffd27a" stroke="#1e2f1e" stroke-width="1.5"/>
  <ellipse cx="146" cy="82" rx="9" ry="6" fill="#ffd27a" stroke="#1e2f1e" stroke-width="1.5"/>
  <ellipse cx="111" cy="84" rx="2.5" ry="4.5" fill="#1a0f05"/>
  <ellipse cx="147" cy="82" rx="2.5" ry="4.5" fill="#1a0f05"/>
  <!-- brow -->
  <path d="M100 76 L120 80 M156 74 L136 78" stroke="#1e2f1e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- grin -->
  <path d="M106 100 C118 110 142 110 154 98 C142 104 118 104 106 100 Z" fill="#1a0f05" stroke="#1e2f1e" stroke-width="1.5"/>
  <g fill="#e5e7eb">
    <polygon points="112,101 116,107 119,101"/>
    <polygon points="122,102 126,109 130,102"/>
    <polygon points="134,102 138,109 142,102"/>
    <polygon points="146,100 149,106 152,99"/>
  </g>

  <!-- leather cap -->
  <path d="M86 78 C88 52 108 40 128 40 C150 40 168 52 170 78 C158 68 146 62 128 62 C110 62 96 68 86 78 Z"
        fill="url(#tunnel-goblin-leather)" stroke="#2a1608" stroke-width="2.2"/>
  <path d="M86 78 C100 72 114 70 128 70 C142 70 156 72 170 78" fill="none" stroke="#2a1608" stroke-width="2"/>
  <!-- goggles pushed up on cap -->
  <path d="M96 60 L162 58" stroke="#3e2612" stroke-width="4"/>
  <circle cx="108" cy="60" r="10" fill="#7ac8c0" stroke="#8a6d1d" stroke-width="3"/>
  <circle cx="150" cy="58" r="10" fill="#7ac8c0" stroke="#8a6d1d" stroke-width="3"/>
  <circle cx="105" cy="57" r="3" fill="#e0fffb" opacity="0.8"/>
  <circle cx="147" cy="55" r="3" fill="#e0fffb" opacity="0.8"/>
  <!-- headlamp -->
  <rect x="116" y="40" width="24" height="16" rx="3" fill="url(#tunnel-goblin-brass)" stroke="#5c4a12" stroke-width="1.8"/>
  <circle cx="128" cy="48" r="16" fill="url(#tunnel-goblin-lamp)" opacity="0.9"/>
  <circle cx="128" cy="48" r="7" fill="#fff7d6" stroke="#8a6d1d" stroke-width="2"/>
</svg>

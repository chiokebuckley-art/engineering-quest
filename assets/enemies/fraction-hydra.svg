<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img">
  <title>Fraction Hydra: a mossy three-headed forest serpent, each head wearing a glowing fraction — one half, one third and one quarter</title>
  <defs>
    <linearGradient id="fh-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d7c0f"/><stop offset="1" stop-color="#1a2e05"/></linearGradient>
    <linearGradient id="fh-neck" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3f6212"/><stop offset="0.5" stop-color="#65a30d"/><stop offset="1" stop-color="#3f6212"/></linearGradient>
    <radialGradient id="fh-eye" cx="0.4" cy="0.4" r="0.6"><stop offset="0" stop-color="#fff7d6"/><stop offset="0.5" stop-color="#facc15"/><stop offset="1" stop-color="#a16207"/></radialGradient>
    <radialGradient id="fh-shadow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#000" stop-opacity="0.5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="fh-rune" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#d9f99d" stop-opacity="0.7"/><stop offset="1" stop-color="#d9f99d" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="128" cy="236" rx="96" ry="14" fill="url(#fh-shadow)"/>
  <!-- body and tail -->
  <path d="M40 222 C 40 170, 80 150, 128 150 C 176 150, 216 170, 216 222 Z" fill="url(#fh-body)" stroke="#0f172a" stroke-width="4"/>
  <path d="M214 214 C 240 206, 248 186, 236 172" fill="none" stroke="#3f6212" stroke-width="12" stroke-linecap="round"/>
  <g fill="#65a30d" opacity="0.7"><circle cx="92" cy="186" r="6"/><circle cx="128" cy="176" r="7"/><circle cx="164" cy="188" r="6"/><circle cx="110" cy="206" r="5"/><circle cx="150" cy="208" r="5"/></g>
  <!-- three necks -->
  <path d="M92 166 C 70 130, 40 110, 48 70" fill="none" stroke="#0f172a" stroke-width="30" stroke-linecap="round"/>
  <path d="M92 166 C 70 130, 40 110, 48 70" fill="none" stroke="url(#fh-neck)" stroke-width="22" stroke-linecap="round"/>
  <path d="M128 158 C 128 120, 126 90, 128 52" fill="none" stroke="#0f172a" stroke-width="32" stroke-linecap="round"/>
  <path d="M128 158 C 128 120, 126 90, 128 52" fill="none" stroke="url(#fh-neck)" stroke-width="24" stroke-linecap="round"/>
  <path d="M164 166 C 186 130, 216 110, 208 70" fill="none" stroke="#0f172a" stroke-width="30" stroke-linecap="round"/>
  <path d="M164 166 C 186 130, 216 110, 208 70" fill="none" stroke="url(#fh-neck)" stroke-width="22" stroke-linecap="round"/>
  <!-- heads, each with its fraction rune -->
  <g stroke="#0f172a" stroke-width="4" stroke-linejoin="round">
    <path d="M26 64 C 26 44, 60 38, 72 58 L 76 76 C 60 86, 34 86, 26 64 Z" fill="#65a30d"/>
    <path d="M104 44 C 104 22, 152 22, 152 44 L 150 66 C 138 76, 118 76, 106 66 Z" fill="#84cc16"/>
    <path d="M230 64 C 230 44, 196 38, 184 58 L 180 76 C 196 86, 222 86, 230 64 Z" fill="#65a30d"/>
  </g>
  <circle cx="44" cy="58" r="6" fill="url(#fh-eye)"/><circle cx="118" cy="38" r="6" fill="url(#fh-eye)"/><circle cx="138" cy="38" r="6" fill="url(#fh-eye)"/><circle cx="212" cy="58" r="6" fill="url(#fh-eye)"/>
  <path d="M30 72 L 70 74 M 110 64 L 146 64 M 226 72 L 186 74" stroke="#1a2e05" stroke-width="3" stroke-linecap="round"/>
  <g font-family="Georgia, serif" font-weight="700" fill="#ecfccb" text-anchor="middle">
    <circle cx="50" cy="100" r="18" fill="url(#fh-rune)"/><text x="50" y="96" font-size="15">1</text><rect x="42" y="99" width="16" height="2.5" fill="#ecfccb"/><text x="50" y="114" font-size="15">2</text>
    <circle cx="128" cy="96" r="18" fill="url(#fh-rune)"/><text x="128" y="92" font-size="15">1</text><rect x="120" y="95" width="16" height="2.5" fill="#ecfccb"/><text x="128" y="110" font-size="15">3</text>
    <circle cx="206" cy="100" r="18" fill="url(#fh-rune)"/><text x="206" y="96" font-size="15">1</text><rect x="198" y="99" width="16" height="2.5" fill="#ecfccb"/><text x="206" y="114" font-size="15">4</text>
  </g>
</svg>

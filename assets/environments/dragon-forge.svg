<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img">
<title>Dragon Forge: a vast cavern forge with a giant glowing furnace, rivers of molten metal, colossal gears and hanging chains under dramatic amber and red light</title>
<defs>
<linearGradient id="dragon-forge-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0e18"/><stop offset="0.55" stop-color="#2a1a18"/><stop offset="1" stop-color="#3a1c14"/></linearGradient>
<radialGradient id="dragon-forge-furn" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff1c7"/><stop offset="0.25" stop-color="#ffb347"/><stop offset="0.6" stop-color="#ff6a1a"/><stop offset="1" stop-color="#7a1e12"/></radialGradient>
<radialGradient id="dragon-forge-haze" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffb347" stop-opacity="0.45"/><stop offset="0.5" stop-color="#ff6a1a" stop-opacity="0.15"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
<radialGradient id="dragon-forge-lavaglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff6a1a" stop-opacity="0.5"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
<linearGradient id="dragon-forge-lava" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1c7"/><stop offset="0.3" stop-color="#ffb347"/><stop offset="0.7" stop-color="#ff6a1a"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>
<linearGradient id="dragon-forge-stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c566a"/><stop offset="1" stop-color="#232838"/></linearGradient>
<linearGradient id="dragon-forge-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2226"/><stop offset="1" stop-color="#15121a"/></linearGradient>
<linearGradient id="dragon-forge-brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a227"/><stop offset="1" stop-color="#5a4713"/></linearGradient>
<linearGradient id="dragon-forge-iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b7280"/><stop offset="1" stop-color="#2b3040"/></linearGradient>
</defs>
<rect width="1280" height="720" fill="url(#dragon-forge-bg)"/>
